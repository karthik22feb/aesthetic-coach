# Local development environment -- see docs/12-deployment-guide.md, section 2
#
# Host-side ports for mysql/redis are remapped (3307/6380) on this specific
# shared dev server because the host already runs its own native MySQL/Redis
# on 3306/6379 (see SERVER_SETUP_REPORT.md). The app container is unaffected --
# it talks to the internal service names/ports (mysql:3306, redis:6379) over
# the Compose network, never through the published host ports.
services:
  app:
    build: ./backend
    volumes: ["./backend:/var/www/html"]
    ports: ["8000:8000"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ./backend/.env
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: aesthetic_coach
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes: ["mysql_data:/var/lib/mysql"]
    ports: ["3307:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  mailhog:
    image: mailhog/mailhog
    ports: ["8025:8025"]
volumes:
  mysql_data:

name: Mobile CI

# Task 7 scope only (TASK_BREAKDOWN.md § Sprint 1): analyze, format check,
# test job skeleton -- per docs/11-cicd-pipeline.md § 3.2, the full mobile
# pipeline also builds a signed Android AAB and iOS archive, but those need
# release-signing credentials that don't exist yet (no Fastlane/signing
# setup has happened). Deferred to whichever future session wires that up,
# consistent with this session's explicit scope (no CI requiring
# unavailable secrets).

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  push:
    # TEMPORARY, for this session's CI verification only (no gh/API access
    # available to open a real PR against main) -- narrowed back to
    # `branches: [main]` before the final commit, matching
    # docs/11-cicd-pipeline.md section 3.2 ("Both pipelines run on every PR
    # against main").
    branches: [main, "feature/flutter-foundation"]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"

defaults:
  run:
    working-directory: mobile

jobs:
  analyze-and-test:
    name: Analyze, format check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # "Flutter (latest stable)" per docs/08-mobile-architecture.md's own
      # stack line -- tracks the stable channel rather than a pinned
      # version, matching that documented policy.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Unit + widget tests
        run: flutter test
